{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tmrwe.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tmrwe.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tmrwe.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range .Values.networkPolicy.allowedClientCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
{{- end }}
