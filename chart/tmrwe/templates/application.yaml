apiVersion: app.k8s.io/v1beta1
kind: Application
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    marketplace.cloud.google.com/deploy-info: '{"partner_id": "lapatikala", "product_id": "tmrwe-gke-marketplace", "partner_name": "Lapatikala"}'
  labels:
    {{- include "tmrwe.labels" . | nindent 4 }}
spec:
  descriptor:
    type: tmrwe
    version: {{ .Chart.AppVersion | quote }}
    description: Deterministic replay and bounded counterfactual analysis service.
  selector:
    matchLabels:
      {{- include "tmrwe.selectorLabels" . | nindent 6 }}
  componentKinds:
    - group: apps
      kind: Deployment
    - group: ""
      kind: Service
    - group: ""
      kind: Secret
