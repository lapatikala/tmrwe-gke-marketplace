apiVersion: app.k8s.io/v1beta1
kind: Application
metadata:
  name: {{ include "tmrwe.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tmrwe.labels" . | nindent 4 }}
spec:
  descriptor:
    type: tmrwe
    version: {{ .Chart.AppVersion | quote }}
    description: Deterministic replay and bounded counterfactual analysis service.
  selector:
    matchLabels:
      {{- include "tmrwe.selectorLabels" . | nindent 6 }}
  componentKinds:
    - group: apps
      kind: Deployment
    - group: ""
      kind: Service
